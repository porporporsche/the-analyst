name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # 実データ（トヨタ/任天堂/キヤノンの有報）による解析テストと、Actions実行を再現する結合テスト（外部通信なし）
      - run: python -m pytest -q tests
      # 架空データでレポートが生成できること
      - run: python -m scanner.main --demo --no-llm --out "$RUNNER_TEMP/demo"
